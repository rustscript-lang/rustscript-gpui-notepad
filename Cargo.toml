[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
vm = { package = "pd-vm", path = "/home/wow/rustscript/rustscript", default-features = false, features = ["runtime"] }

[dev-dependencies]
tempfile = "3"
